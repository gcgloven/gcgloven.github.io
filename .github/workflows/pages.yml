name: Deploy Observatory to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - orbital-public-output.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out public publishing files
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extract prebuilt website
        run: |
          unzip -q orbital-public-output.zip -d _site
          test -f _site/index.html
          test -f _site/.nojekyll
          for private_path in content docs src node_modules keystatic api .env .git; do
            test ! -e "_site/$private_path"
          done
          test -z "$(find _site -type l -print -quit)"
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
